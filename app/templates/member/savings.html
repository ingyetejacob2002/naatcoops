{% extends 'layouts/base.html' %}

{% block content %}

<div class="max-w-lg mx-auto bg-white rounded-2xl shadow p-8">

<h2 class="text-3xl font-bold mb-6">Add Savings</h2>

<form method="POST">

{{ form.hidden_tag() }}

<div class="mb-4">
{{ form.amount.label }}
{{ form.amount(class='w-full border p-3 rounded-lg') }}
</div>

{{ form.submit(class='bg-green-700 text-white px-6 py-3 rounded-lg') }}

</form>

</div>

{% endblock %}
